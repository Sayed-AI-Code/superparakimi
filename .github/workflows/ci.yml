name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: superparakimi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL_TEST being set is itself the selector: it picks the
      # node-postgres backend in db/index.ts (selectTestBackend), so CI runs
      # against a real postgres:16 and a local clone without it falls back to
      # in-process PGlite. Nothing else needs to know which CI is which.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/superparakimi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Route types (LayoutProps etc.) are generated by Next, never committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  # The smoke lives in its own workflow (e2e.yml): it needs a browser install,
  # a build, and a production-mode server, which is a different cost profile and
  # a different failure vocabulary from this suite.
